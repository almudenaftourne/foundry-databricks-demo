# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-databricks-langgraph-specialist
infra:
  provider: microsoft.foundry
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
services:
  langgraph-specialist:
    name: foundry-dbx-langgraph-specialist
    host: azure.ai.agent
    kind: hosted
    language: python
    project: .
    description: Drafts a proposed owner/action checklist from supplied synthetic project evidence.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: "-m langchain_azure_ai.agents.hosting.run --protocol responses"
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      PYTHONNOUSERSITE: "1"
    uses:
      - ai-project
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
